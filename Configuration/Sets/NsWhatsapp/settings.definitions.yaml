categories:
  ns_whatsapp:
    label: LLL:EXT:ns_whatsapp/Resources/Private/Language/locallang.xlf:brandname

  ns_whatsapp.view:
    label: View Settings
    parent: ns_whatsapp

  ns_whatsapp.chat:
    label: LLL:EXT:ns_whatsapp/Resources/Private/Language/locallang.xlf:cat_chat
    parent: ns_whatsapp

  ns_whatsapp.style:
    label: LLL:EXT:ns_whatsapp/Resources/Private/Language/locallang.xlf:cat_style
    parent: ns_whatsapp


settings:

  # -------------------------------------------------
  # View paths (FE)
  # -------------------------------------------------
  ns_whatsapp.view.templateRootPath:
    label: Path to template root (FE)
    category: ns_whatsapp.view
    type: string
    default: EXT:ns_whatsapp/Resources/Private/Templates/

  ns_whatsapp.view.partialRootPath:
    label: Path to template partials (FE)
    category: ns_whatsapp.view
    type: string
    default: EXT:ns_whatsapp/Resources/Private/Partials/

  ns_whatsapp.view.layoutRootPath:
    label: Path to template layouts (FE)
    category: ns_whatsapp.view
    type: string
    default: EXT:ns_whatsapp/Resources/Private/Layouts/


  # =================================================
  # CHAT SETTINGS (free)
  # =================================================
  ns_whatsapp.chat.isEnable:
    label: Is Enable
    category: ns_whatsapp.chat
    type: bool
    default: true

  ns_whatsapp.chat.whatsappNumber:
    label: Whatsapp Number (Enter Country code and Whatsapp Number)
    category: ns_whatsapp.chat
    type: string
    default: ''

  ns_whatsapp.chat.preFilledMessage:
    label: Pre-Filled Message
    category: ns_whatsapp.chat
    type: string
    default: ''

  ns_whatsapp.chat.position:
    label: Position (Display location)
    category: ns_whatsapp.chat
    type: string
    enum:
      Top-left: Top Left
      Top-right: Top Right
      Bottom-left: Bottom Left
      Bottom-right: Bottom Right
    default: Top-left

  ns_whatsapp.chat.webWhatsapp:
    label: Web Whatsapp
    category: ns_whatsapp.chat
    type: bool
    default: true

  ns_whatsapp.chat.hidePages:
    label: Hide on selected pages (comma separated IDs)
    category: ns_whatsapp.chat
    type: string
    default: ''

  ns_whatsapp.chat.hideMobile:
    label: Hide on Mobile
    category: ns_whatsapp.chat
    type: bool
    default: false

  ns_whatsapp.chat.hideDesktop:
    label: Hide on Desktop
    category: ns_whatsapp.chat
    type: bool
    default: false

  # =================================================
  # STYLE SETTINGS (Style 1 optional overrides)
  # Empty = keep values from Whatsapp Style backend module
  # =================================================
  ns_whatsapp.style.style1Text:
    label: Style 1 Button Text Override
    category: ns_whatsapp.style
    type: string
    default: ''

  ns_whatsapp.style.style1TextColor:
    label: Style 1 Text Color
    category: ns_whatsapp.style
    type: string
    enum:
      default: Use default (Whatsapp Style module)
      '#ffffff': White
      '#000000': Black
      '#337ab7': Primary Blue
      '#17a2b8': Info Teal
      '#28a745': Success Green
      '#dc3545': Danger Red
      '#ffc107': Warning Yellow
      '#6c757d': Gray
    default: default

  ns_whatsapp.style.style1BackgroundColor:
    label: Style 1 Background Color
    category: ns_whatsapp.style
    type: string
    enum:
      default: Use default (Whatsapp Style module)
      '#337ab7': Primary Blue
      '#0059a5': Deep Blue
      '#28a745': Success Green
      '#17a2b8': Info Teal
      '#ffffff': White
      '#000000': Black
      '#f8f9fa': Light Gray
      '#6c757d': Gray
    default: default

  ns_whatsapp.style.style1BorderWidth:
    label: Style 1 Border Width (px)
    category: ns_whatsapp.style
    type: string
    default: ''

  ns_whatsapp.style.style1BorderColor:
    label: Style 1 Border Color
    category: ns_whatsapp.style
    type: string
    enum:
      default: Use default (Whatsapp Style module)
      '#337ab7': Primary Blue
      '#0059a5': Deep Blue
      '#28a745': Success Green
      '#17a2b8': Info Teal
      '#ffffff': White
      '#000000': Black
      '#6c757d': Gray
      '#8d8d8d': Mid Gray
    default: default

  ns_whatsapp.style.style1HoverTextColor:
    label: Style 1 Hover Text Color
    category: ns_whatsapp.style
    type: string
    enum:
      default: Use default (Whatsapp Style module)
      '#ffffff': White
      '#000000': Black
      '#337ab7': Primary Blue
      '#17a2b8': Info Teal
      '#28a745': Success Green
      '#dc3545': Danger Red
      '#ffc107': Warning Yellow
      '#6c757d': Gray
    default: default

  ns_whatsapp.style.style1HoverBackgroundColor:
    label: Style 1 Hover Background Color
    category: ns_whatsapp.style
    type: string
    enum:
      default: Use default (Whatsapp Style module)
      '#0059a5': Deep Blue
      '#337ab7': Primary Blue
      '#28a745': Success Green
      '#17a2b8': Info Teal
      '#ffffff': White
      '#000000': Black
      '#f8f9fa': Light Gray
      '#6c757d': Gray
    default: default

  ns_whatsapp.style.style1HoverBorderColor:
    label: Style 1 Hover Border Color
    category: ns_whatsapp.style
    type: string
    enum:
      default: Use default (Whatsapp Style module)
      '#0059a5': Deep Blue
      '#337ab7': Primary Blue
      '#28a745': Success Green
      '#17a2b8': Info Teal
      '#ffffff': White
      '#000000': Black
      '#6c757d': Gray
      '#8d8d8d': Mid Gray
    default: default
