<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Css/backend.css', extensionName: 'backend')}" media="all">
<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Vendor/bootstrap4.3.1.min.css', extensionName: 'ns_whatsapp')}" media="all">
<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Css/font-awesome.css', extensionName: 'ns_whatsapp')}" media="all">
<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Css/global.css', extensionName: 'ns_whatsapp')}" media="all">
<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Css/main.css', extensionName: 'ns_whatsapp')}" media="all">
<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Css/nswhatsapp.css', extensionName: 'ns_whatsapp')}" media="all">
<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Css/backend-premium-strip.css', extensionName: 'ns_whatsapp')}" media="all">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
<script type="text/javascript" src="{f:uri.resource(path:'JavaScript/custom.js', extensionName: 'ns_whatsapp')}"></script>

	<div class="typo3-fullDoc">
		<div id="typo3-docbody">
			<div id="typo3-inner-docbody" style="padding: 24px;margin-top: 0;transition: border .2s ease;">
				<f:if condition="{trialUrl}">
					<div class="ns-whatsapp-premium-strip d-flex flex-wrap align-items-center justify-content-between gap-3">
						<div class="d-flex align-items-center gap-3">
							<span class="ns-whatsapp-premium-strip-icon"><core:icon identifier="actions-rocket" size="small" /></span>
							<div>
								<div class="ns-whatsapp-premium-strip-headline"><f:translate key="premium.strip.headline" extensionName="ns_whatsapp" /></div>
								<div class="ns-whatsapp-premium-strip-description"><f:translate key="premium.strip.description" extensionName="ns_whatsapp" /></div>
							</div>
						</div>
						<a href="{trialUrl}" class="btn btn-primary"><f:translate key="premium.strip.trial" extensionName="ns_whatsapp" /> <span aria-hidden="true">&rarr;</span></a>
					</div>
				</f:if>
				<div class="ns-ext-navigation-wrap">
					<a class="navbar-brand ns-ext-name ns-ext-name-desktop" href="javascript:;"><f:translate key="brandname" /></a>
					<div class="ns-ext-navigation">
						<nav class="navbar navbar-expand-lg">
							<a class="navbar-brand ns-ext-name" href="javascript:;"><f:translate key="brandname" /></a>
							<div class="collapse navbar-collapse" id="nsextNavbar">
								<ul class="navbar-nav">
									<li class="nav-item  active">
										<f:link.action action="styleSettings" class="nav-link">
											<em class="fa fas fa-adjust" aria-hidden="true"></em><f:translate key="styleSettings" />
										</f:link.action>
									</li>									
								</ul>
							</div>
						</nav>
					</div>
				</div>
				<f:render section="content" />
			</div>
		</div>
	</div>
</html>
